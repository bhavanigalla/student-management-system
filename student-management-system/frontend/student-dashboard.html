 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <div class="dashboard-header">
            <h1>Student Dashboard</h1>

            <button id="logoutBtn" class="btn logout-btn">
                Logout
            </button>
        </div>

        <div id="message">
            Loading profile...
        </div>

        <div id="profileCard" class="profile-card" style="display: none;">

            <h2>My Profile</h2>

            <p>
                <strong>Name:</strong>
                <span id="name"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="email"></span>
            </p>

            <p>
                <strong>Course:</strong>
                <span id="course"></span>
            </p>

            <p>
                <strong>Year:</strong>
                <span id="year"></span>
            </p>

        </div>

        <div id="attendanceCard" class="profile-card" style="display: none;">

            <h2>Attendance</h2>

            <p>
                <strong>Total Classes:</strong>
                <span id="totalClasses"></span>
            </p>

            <p>
                <strong>Present:</strong>
                <span id="present"></span>
            </p>

            <p>
                <strong>Absent:</strong>
                <span id="absent"></span>
            </p>

            <p>
                <strong>Attendance Percentage:</strong>
                <span id="percentage"></span>%
            </p>

        </div>

    </div>

    <script src="js/student-dashboard.js"></script>

</body>
</html>
